services:
  web:
    build:
      context: .
      target: web
    environment:
      SERVITAS_DATA_DIR: /data
      SERVITAS_ORIGIN: ${SERVITAS_ORIGIN:-http://localhost:8080}
      SERVITAS_BOOTSTRAP_TOKEN: ${SERVITAS_BOOTSTRAP_TOKEN:?Set a random installation key of at least 32 characters}
    volumes:
      - platform-data:/data
    restart: unless-stopped
    networks: [control]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      target: worker
    environment:
      SERVITAS_DATA_DIR: /data
      SERVITAS_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - platform-data:/data
      - ${SERVITAS_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped
    networks: [control]
  caddy:
    image: caddy:2.11-alpine
    environment:
      SERVITAS_ADDRESS: ${SERVITAS_ADDRESS:-:80}
    ports:
      - ${SERVITAS_HTTP_BIND:-127.0.0.1:8080}:80
      - ${SERVITAS_HTTPS_BIND:-127.0.0.1:8443}:443
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [control]
networks:
  control:
volumes:
  platform-data:
  caddy-data:
  caddy-config:
